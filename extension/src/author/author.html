<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Author feed — Xivary</title>
<link rel="stylesheet" href="../ui/page.css"><link rel="stylesheet" href="../ui/undo.css"><link rel="stylesheet" href="../ui/author-collection-picker.css"><link rel="stylesheet" href="../ui/publication-time-filter.css"><link rel="stylesheet" href="author.css"><link rel="stylesheet" href="../ui/follow-button.css"><script type="module" src="author.js"></script></head><body>
<header class="page-header">
  <div class="app-bar"><a class="app-name" href="../library/library.html">Xivary</a><nav class="app-nav" aria-label="Primary"><a href="../library/library.html">Library</a><a href="../authors/authors.html" aria-current="page">Following</a></nav></div>
  <div class="page-heading"><a class="local-back" href="../authors/authors.html">← Following</a><div class="author-heading"><h1 id="name">Researcher</h1><button id="follow-author" type="button" disabled>Follow</button><button id="author-collections" type="button" hidden>Collections</button></div><p id="identity" class="subtitle">Matched by author name</p></div>
</header>
<main>
  <div class="toolbar author-tools">
    <button id="refresh" class="icon-control" type="button" aria-label="Refresh" title="Refresh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5"/><path d="M18.2 15a7 7 0 1 1-.7-7.8L20 10"/></svg></button>
    <a id="open-search" class="icon-control" aria-label="Open on arXiv" title="Open on arXiv"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg></a>
    <button id="show-filters" class="icon-control" type="button" aria-label="Search papers" title="Search papers" aria-expanded="false" aria-controls="filters"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg></button>
    <section id="filters" aria-label="Search papers" hidden><div class="search-field"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><label class="visually-hidden" for="paper-query">Search papers</label><input id="paper-query" type="search" placeholder="Search title, author, abstract, or category"></div></section>
    <button id="date-range" type="button" aria-label="Publication time: Any time" aria-haspopup="menu" aria-expanded="false"><span id="range-label">Any time</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3.5 6 4.5 4 4.5-4"/></svg></button>
    <span id="filter-count" class="metadata"></span>
  </div>
  <form id="custom-years" class="custom-years" hidden novalidate>
    <label for="year-from">From year<input id="year-from" type="text" inputmode="numeric" maxlength="4" placeholder="Any" title="Leave blank for no starting year" aria-describedby="year-feedback"></label>
    <label for="year-to">To year<input id="year-to" type="text" inputmode="numeric" maxlength="4" placeholder="Any" title="Leave blank for no ending year" aria-describedby="year-feedback"></label>
    <button type="submit">Apply</button><button id="clear-years" type="button">Clear range</button>
    <span id="year-feedback" class="metadata" role="status" aria-live="polite"></span>
  </form>
  <p id="updated" class="metadata"></p>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <div id="papers"></div>
  <p id="empty" class="empty" hidden>No papers were returned for this author name.</p>
</main>
</body></html>
