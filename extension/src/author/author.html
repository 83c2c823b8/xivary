<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Researcher Papers</title>
<link rel="stylesheet" href="../ui/page.css"><link rel="stylesheet" href="../ui/author-collection-picker.css"><link rel="stylesheet" href="author.css"><script type="module" src="author.js"></script></head><body>
<header class="page-header">
  <div class="app-bar"><a class="app-name" href="../library/library.html">arXiv Research Library</a><nav class="app-nav" aria-label="Primary"><a href="../library/library.html">Library</a><a href="../authors/authors.html" aria-current="page">Following</a></nav></div>
  <div class="page-heading"><a class="local-back" href="../authors/authors.html">← Following</a><h1 id="name">Researcher</h1><p id="identity" class="subtitle">Matched by author name</p></div>
</header>
<main>
  <div class="toolbar author-tools">
    <button id="refresh" class="icon-control" type="button" aria-label="Refresh" title="Refresh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5"/><path d="M18.2 15a7 7 0 1 1-.7-7.8L20 10"/></svg></button>
    <a id="open-search" class="icon-control" aria-label="Open on arXiv" title="Open on arXiv"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg></a>
    <button id="show-filters" class="icon-control" type="button" aria-label="Search papers" title="Search papers" aria-expanded="false" aria-controls="filters"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg></button>
    <span id="updated" class="metadata"></span>
  </div>
  <section id="filters" class="author-filters" aria-label="Filter papers" hidden>
    <div class="search-field"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><label class="visually-hidden" for="paper-query">Search papers</label><input id="paper-query" type="search" placeholder="Search title, author, abstract, or category"></div>
    <label class="range-field" for="date-range"><span class="visually-hidden">Date range</span><select id="date-range"><option value="any">Any time</option><option value="year">Past year</option><option value="three-years">Past 3 years</option><option value="custom">Custom…</option></select></label>
    <div id="custom-dates" class="custom-dates" hidden><label>From <input id="date-from" type="date"></label><label>To <input id="date-to" type="date"></label></div>
    <span id="filter-count" class="metadata"></span>
  </section>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <div id="papers"></div>
  <p id="empty" class="empty" hidden>No papers were returned for this author name.</p>
</main>
</body></html>
