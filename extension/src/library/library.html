<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Library — Xivary</title>

<header class="page-header">
  <div class="app-bar"><a class="app-name" href="library.html">Xivary</a><nav class="app-nav" aria-label="Primary"><a href="library.html" aria-current="page">Library</a><a href="../authors/authors.html">Following</a></nav></div>
  <div class="page-heading page-heading-with-action"><h1>Library</h1><a class="settings-link" href="../settings/settings.html" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.09A1.7 1.7 0 0 0 8.55 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.09A1.7 1.7 0 0 0 4.6 8.55a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.09A1.7 1.7 0 0 0 15.45 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.14.38.35.72.6 1 .3.28.68.41 1.1.4h.09v4h-.09a1.7 1.7 0 0 0-1.7.6Z"/></svg></a></div>
</header>
<main class="library-layout">
  <aside class="collection-sidebar" aria-label="Library collections">
    <nav aria-label="Paper collections"><ul id="collection-list" class="collection-list"></ul></nav>
    <div class="collection-tools">
      <button id="show-create" class="quiet-action" type="button" aria-expanded="false" aria-controls="create-form"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New collection</span></button>
      <form id="create-form" class="inline-create" hidden>
        <label class="visually-hidden" for="collection-name">New collection name</label>
        <input id="collection-name" type="text" maxlength="80" placeholder="Collection name" required>
      </form>
    </div>
  </aside>
  <section class="library-content" aria-label="Saved papers">
    <div class="library-toolbar"><label for="filter">Filter papers</label><div class="search-field"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><input id="filter" type="search" placeholder="Title, author, category"></div><span id="count" class="metadata"></span></div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <ul id="papers" class="paper-list"></ul>
    <p id="empty" class="empty" hidden>No saved papers.</p><button id="clear-filter" type="button" class="clear-filter" hidden>Clear search</button>
  </section>
</main>
</body></html>
