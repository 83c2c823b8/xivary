<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saved Papers</title>
<link rel="stylesheet" href="../ui/page.css"><link rel="stylesheet" href="../ui/author-collection-picker.css"><link rel="stylesheet" href="library.css"><script type="module" src="library.js"></script></head><body>
<header class="page-header">
  <div class="app-bar"><a class="app-name" href="library.html">arXiv Research Library</a><nav class="app-nav" aria-label="Primary"><a href="library.html" aria-current="page">Library</a><a href="../authors/authors.html">Following</a></nav></div>
  <div class="page-heading"><h1>Library</h1></div>
</header>
<main><div class="toolbar"><label>Collection<select id="collection-filter"><option value="">All Saved</option></select></label><label>Filter papers<input id="filter" type="search" placeholder="Title, author, category"></label>
<form id="create-form"><label>New collection<input id="collection-name" type="text" maxlength="80" required></label><button>Create</button></form><span id="count" class="metadata"></span></div>
<form id="manage-form" class="collection-manager" hidden><label>Selected collection<input id="rename-name" type="text" maxlength="80" required></label><button>Rename</button><button id="delete" type="button">Delete</button></form>
<p id="status" class="status" role="status" aria-live="polite"></p><ul id="papers" class="paper-list"></ul><p id="empty" class="empty" hidden>No saved papers yet. Use the bookmark on an arXiv page or paper result.</p></main>
</body></html>
