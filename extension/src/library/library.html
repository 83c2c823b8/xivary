<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Library — Xivary</title>
<link rel="stylesheet" href="../ui/page.css"><link rel="stylesheet" href="../ui/author-collection-picker.css"><link rel="stylesheet" href="library.css"><script type="module" src="library.js"></script></head><body>
<header class="page-header">
  <div class="app-bar"><a class="app-name" href="library.html">Xivary</a><nav class="app-nav" aria-label="Primary"><a href="library.html" aria-current="page">Library</a><a href="../authors/authors.html">Following</a></nav></div>
  <div class="page-heading"><h1>Library</h1></div>
</header>
<main class="library-layout">
  <aside class="collection-sidebar" aria-label="Library collections">
    <nav aria-label="Paper collections"><ul id="collection-list" class="collection-list"></ul></nav>
    <div class="collection-tools">
      <button id="show-create" class="quiet-action" type="button" aria-expanded="false" aria-controls="create-form">+ New collection</button>
      <form id="create-form" class="inline-create" hidden>
        <label class="visually-hidden" for="collection-name">New collection name</label>
        <input id="collection-name" type="text" maxlength="80" placeholder="Collection name" required>
      </form>
    </div>
  </aside>
  <section class="library-content" aria-label="Saved papers">
    <div class="library-toolbar"><label for="filter">Filter papers</label><div class="search-field"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><input id="filter" type="search" placeholder="Title, author, category"></div><span id="count" class="metadata"></span></div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <ul id="papers" class="paper-list"></ul>
    <p id="empty" class="empty" hidden>No saved papers.</p>
  </section>
</main>
</body></html>
