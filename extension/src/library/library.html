<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saved Papers</title>
<link rel="stylesheet" href="../ui/page.css"><link rel="stylesheet" href="../ui/author-collection-picker.css"><link rel="stylesheet" href="library.css"><script type="module" src="library.js"></script></head><body>
<header class="page-header">
  <div class="app-bar"><a class="app-name" href="library.html">arXiv Research Library</a><nav class="app-nav" aria-label="Primary"><a href="library.html" aria-current="page">Library</a><a href="../authors/authors.html">Following</a></nav></div>
  <div class="page-heading"><h1>Library</h1></div>
</header>
<main class="library-layout">
  <aside class="collection-sidebar" aria-label="Library collections">
    <nav aria-label="Paper collections"><ul id="collection-list" class="collection-list"></ul></nav>
    <div class="collection-tools">
      <button id="show-create" class="quiet-action" type="button" aria-expanded="false" aria-controls="create-form">+ New collection</button>
      <form id="create-form" class="sidebar-form" hidden>
        <label for="collection-name">New collection</label><input id="collection-name" type="text" maxlength="80" placeholder="Collection name" required>
        <div><button>Create</button><button id="cancel-create" type="button">Cancel</button></div>
      </form>
      <button id="show-manage" class="quiet-action" type="button" aria-expanded="false" aria-controls="manage-form" hidden>Manage collection</button>
      <form id="manage-form" class="sidebar-form" hidden>
        <label for="rename-name">Collection name</label><input id="rename-name" type="text" maxlength="80" required>
        <div><button>Rename</button><button id="delete" type="button">Delete</button><button id="close-manage" type="button">Cancel</button></div>
      </form>
    </div>
  </aside>
  <section class="library-content" aria-label="Saved papers">
    <div class="library-toolbar"><label for="filter">Filter papers</label><input id="filter" type="search" placeholder="Title, author, category"><span id="count" class="metadata"></span></div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <ul id="papers" class="paper-list"></ul>
    <p id="empty" class="empty" hidden>No saved papers yet. Use the bookmark on an arXiv page or paper result.</p>
  </section>
</main>
</body></html>
