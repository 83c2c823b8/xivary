<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search arXiv</title>
<link rel="stylesheet" href="../ui/page.css"><link rel="stylesheet" href="../ui/author-collection-picker.css"><link rel="stylesheet" href="search.css"><script type="module" src="search.js"></script></head><body>
<header class="page-header">
  <div class="app-bar"><a class="app-name" href="../library/library.html">arXiv Research Library</a><nav class="app-nav" aria-label="Primary"><a href="../library/library.html">Library</a><a href="../authors/authors.html">Following</a></nav></div>
  <div class="page-heading"><h1>Search arXiv</h1></div>
</header>
<main><form id="search-form" class="search-form"><label>Query<input id="query" type="search" maxlength="200" required placeholder="e.g. mirror symmetry for K3"></label><label>Field<select id="field"></select></label>
<fieldset><legend>Mode</legend><label><input type="radio" name="mode" value="exact"> Exact</label><label><input type="radio" name="mode" value="balanced" checked> Balanced</label><label><input type="radio" name="mode" value="broad"> Broad</label></fieldset>
<div class="form-actions"><button type="submit">Search</button><button id="native-search" type="button">Open on arXiv</button></div><details><summary>Expanded query</summary><pre id="preview">Enter a query to preview.</pre></details></form>
<hr><h2>Results</h2><p id="status" class="status" role="status" aria-live="polite"></p><ul id="results" class="paper-list"></ul><p id="empty" class="empty" hidden>No results returned.</p></main>
</body></html>
