<main id="following-layout">
  <aside id="collection-sidebar" class="collection-sidebar" aria-label="Following collections" hidden>
    <nav aria-label="Author collections"><ul id="collection-list" class="collection-list"></ul></nav>
    <div class="collection-tools">
      <button id="show-create" class="quiet-action" type="button" aria-expanded="false" aria-controls="create-form">+ New collection</button>
      <form id="create-form" class="inline-create" hidden>
        <label class="visually-hidden" for="collection-name">New collection name</label>
        <input id="collection-name" type="text" maxlength="80" placeholder="Collection name" required>
      </form>
    </div>
  </aside>
  <section class="following-content" aria-label="Followed authors">
    <div id="collection-toolbar" class="toolbar" hidden><span id="count" class="metadata"></span></div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
<ul id="authors" class="author-list"></ul><p id="empty" class="empty" hidden>No followed researchers.</p></section></main>
</body></html>
